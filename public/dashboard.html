<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
body{background:#000;color:#0f0;font-family:Consolas}
.log{height:300px;overflow:auto;border:1px solid #0f0}
.danger{color:red}
</style>
</head>
<body>

<h2>DASHBOARD</h2>

<div id="log" class="log"></div>

<script>
let evt=new EventSource('/api/stream');

evt.onmessage=function(e){
 let l=JSON.parse(e.data);

 let d=document.createElement("div");
 d.innerText=`${l.user} -> ${l.action} : ${l.ok?"ALLOW":"DENY"}`;
 d.className=l.ok?"":"danger";

 log.appendChild(d);
};
</script>

</body>
</html>
