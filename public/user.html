<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
body{background:#000;color:#0f0;font-family:Consolas}
.terminal{height:250px;border:1px solid #0f0;overflow:auto;padding:10px}
.allow{color:#0f0}
.deny{color:red}
</style>
</head>
<body>

<h2>USER TERMINAL</h2>

User:
<select id="user"></select>
<button onclick="login()">Login</button>

<br><br>

File:
<select id="file"></select>

<br><br>

<button onclick="act('open')">Open</button>
<button onclick="act('edit')">Edit</button>

<div id="term" class="terminal"></div>

<script>
let uid=null;

function log(t,c=""){
  let d=document.createElement("div");
  d.className=c;
  d.innerText=t;
  term.appendChild(d);
}

async function load(){
  let r=await fetch('/api/matrix');
  let j=await r.json();

  user.innerHTML=j.users.map(u=>`<option>${u}</option>`).join('');
  file.innerHTML=j.files.map((f,i)=>`<option value=${i}>${f}</option>`).join('');
}

async function login(){
  let u=user.value;
  let r=await fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:u})
  });
  let j=await r.json();
  uid=j.user_id;
  log("CONNECTED "+u,"allow");
}

async function act(a){
  let r=await fetch('/api/action',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user_id:uid,
      file_id:+file.value,
      action:a
    })
  });

  let j=await r.json();

  if(j.blocked){
    log("USER BLOCKED","deny");
    return;
  }

  log("REQUEST "+a);

  if(j.allowed){
    log("ALLOW","allow");
  }else{
    log("DENY","deny");
  }
}

load();
</script>

</body>
</html>
