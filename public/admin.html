<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
body{background:#000;color:#0f0;font-family:Consolas}
table{border-collapse:collapse}
td,th{border:1px solid #0f0;padding:5px}
</style>
</head>
<body>

<h2>ADMIN</h2>
<button onclick="save()">SAVE</button>
<div id="t"></div>

<script>
let users,files,perm;

async function load(){
 let r=await fetch('/api/matrix');
 let j=await r.json();
 users=j.users; files=j.files; perm=j.perm;
 render();
}

function render(){
 let html='<table><tr><th></th>';
 files.forEach(f=>html+=`<th>${f}</th>`);
 html+='</tr>';

 users.forEach((u,i)=>{
  html+=`<tr><th>${u}</th>`;
  files.forEach((f,j)=>{
    html+=`<td><input type=number value=${perm[i][j]} onchange="perm[${i}][${j}]=this.value"></td>`;
  });
  html+='</tr>';
 });

 html+='</table>';
 t.innerHTML=html;
}

async function save(){
 await fetch('/api/matrix',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({perm})
 });
 alert("saved");
}

load();
</script>

</body>
